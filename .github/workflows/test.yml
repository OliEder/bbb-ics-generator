name: Run Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-e2e:
    name: Unit & E2E Tests (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit and e2e tests
        run: node --test tests/e2e/*.test.js

  accessibility:
    name: Accessibility Tests (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # @network-Tests (API-Smoke-Tests gegen basketball-bund.net) laufen NICHT im PR-Lauf, damit
      # PRs nicht von der Live-API abhängen — siehe .github/workflows/api-smoke.yml.
      - name: Run Playwright tests (ohne Netzwerk-Smoke-Tests)
        run: npx playwright test --grep-invert @network

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
