name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'  # Alle 6 Stunden
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          
      - name: Install dependencies
        run: npm install
        
      # Fehler einzelner Clubs (Exitcode 1) sollen das Deployment der übrigen Clubs nicht
      # verhindern (ADR-022): Schritt darf fehlschlagen, der Job wird am Ende rot markiert.
      - name: Generate ICS files and HTML
        id: generate
        continue-on-error: true
        run: npm run update

      # Guard: Bei Totalausfall (keine ICS erzeugt) NICHT deployen, sonst würde die
      # funktionierende Seite durch eine leere ersetzt.
      - name: Verify generated output
        run: |
          if ! find generated -name '*.ics' -print -quit | grep -q .; then
            echo "::error::Keine ICS-Dateien erzeugt — Deployment abgebrochen"
            exit 1
          fi

      - name: List generated files (debug)
        run: |
          echo "=== Contents of generated/ ==="
          find generated/ -maxdepth 3 -type d
          echo "=== ICS files ==="
          find generated/ -name "*.ics" -ls
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./generated
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Fail job if generation reported errors
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::error::npm run update meldete Fehler (siehe Log). Die übrigen Clubs wurden deployt."
          exit 1
